[package]
name = "rustrequest"
version = "0.1.0"
edition = "2024"
description = "A fast Rust web scraper & crawler with a graphical and terminal UI, proxy support, and JavaScript detection/removal"
license = "MIT"
keywords = ["scraper", "crawler", "tui", "cli", "web"]
categories = ["command-line-utilities", "web-programming"]
repository = "https://github.com/linuxguytech52-sys/rustrequest"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
csv = "1.4.0"
eframe = "0.37.0"
futures = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["rustls", "socks", "cookies", "gzip", "brotli", "deflate", "json", "charset", "http2", "system-proxy"] }
rfd = "0.18.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
url = "2.5.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
